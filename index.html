
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idolamu Live Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      color: #202833;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #24374a;
      color: white;
      font-size: 15px;
      margin: 7px 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 8px;
    }

    #reader video {
      object-fit: cover;
    }

    #result {
      padding: 14px;
      background: #eef3f7;
      border-radius: 7px;
      margin-top: 15px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .status {
      font-size: 13px;
      color: #64717d;
      line-height: 1.5;
    }

    .scanner-info {
      font-size: 12px;
      color: #64717d;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Idolamu Live Scanner</h2>

  <p class="status" id="status">
    Scanner belum dijalankan.
  </p>

  <button id="startButton" onclick="startScanner()">
    Aktifkan Kamera Belakang
  </button>

  <button id="stopButton" onclick="stopScanner()">
    Matikan Kamera
  </button>

  <div id="reader"></div>

  <div id="result">
    Barcode: Belum terbaca
  </div>

  <div class="scanner-info">
    High Precision Scanning · Small Barcode Detection
    <br>
    Arahkan kamera ke barcode dan tunggu hingga fokus.
  </div>

</div>

<script>

let scanner = null;
let running = false;
let scanLocked = false;
let lastCode = "";

const statusElement = document.getElementById("status");
const resultElement = document.getElementById("result");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");

// Format barcode produk
const BARCODE_FORMATS = [
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.ITF
];


// ==================================================
// START SCANNER
// ==================================================

async function startScanner() {

  if (running || scanner) return;

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    statusElement.textContent =
      "Browser tidak mendukung akses kamera.";
    return;
  }

  try {

    scanLocked = false;
    lastCode = "";

    startButton.disabled = true;

    statusElement.textContent =
      "Memeriksa kamera...";

    resultElement.textContent =
      "Barcode: Menunggu pemindaian...";

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: BARCODE_FORMATS,
      verbose: false
    });

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("Kamera tidak ditemukan.");
    }

    // Prioritaskan kamera belakang
    const backCamera = cameras.find(camera =>
      /back|rear|environment|belakang/i.test(camera.label)
    );

    const cameraConfig = backCamera
      ? backCamera.id
      : { facingMode: "environment" };

    statusElement.textContent =
      "Mengaktifkan kamera berkualitas tinggi...";

    await scanner.start(

      cameraConfig,

      {
        fps: 18,

        // Tidak membatasi pemindaian hanya pada kotak kecil.
        // Seluruh area video digunakan untuk membaca barcode.

        aspectRatio: 16 / 9,

        disableFlip: true,

        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }

      },

      // ==================================================
      // BARCODE BERHASIL DIBACA
      // ==================================================

      async (decodedText) => {

        if (scanLocked || !decodedText) return;

        const barcode = String(decodedText).trim();

        if (!barcode || barcode === lastCode) return;

        scanLocked = true;
        lastCode = barcode;

        resultElement.innerHTML =
          "<b>Barcode terbaca:</b><br>" +
          barcode;

        statusElement.textContent =
          "Barcode berhasil dibaca!";

        // Pertahankan koneksi lama ke Apps Script.
        if (window.opener && !window.opener.closed) {

          window.opener.postMessage(
            {
              type: "IDOLAMU_BARCODE",
              barcode: barcode
            },
            "*"
          );

          statusElement.textContent =
            "Barcode berhasil dikirim ke Idolamu!";

          if (navigator.vibrate) {
            navigator.vibrate(100);
          }

          setTimeout(async () => {
            await stopScanner();
            window.close();
          }, 700);

        } else {

          statusElement.textContent =
            "Barcode terbaca, tetapi jendela Idolamu tidak ditemukan.";

          scanLocked = false;
        }

      },

      // Callback kegagalan pembacaan individual.
      // Tidak menampilkan error agar proses scanning tetap berjalan.
      () => {}

    );

    running = true;

    statusElement.textContent =
      "LIVE SCANNING · Arahkan barcode ke kamera.";

    // Optimasi kemampuan kamera setelah kamera aktif.
    await optimizeCamera();

  } catch (error) {

    statusElement.textContent =
      "Gagal: " + error.message;

    console.error("Scanner error:", error);

    if (scanner) {
      try {
        if (running) await scanner.stop();
      } catch (e) {}

      try {
        await scanner.clear();
      } catch (e) {}
    }

    scanner = null;
    running = false;
    startButton.disabled = false;

  }
}


// ==================================================
// CAMERA OPTIMIZATION
// ==================================================

async function optimizeCamera() {

  if (!scanner || !running) return;

  try {

    // Autofocus berkelanjutan jika didukung perangkat.
    try {
      await scanner.applyVideoConstraints({
        advanced: [
          { focusMode: "continuous" }
        ]
      });
    } catch (e) {
      console.log("Continuous focus tidak didukung.");
    }

    // Periksa kemampuan zoom kamera.
    try {

      const capabilities =
        scanner.getRunningTrackCapabilities();

      if (
        capabilities &&
        capabilities.zoom &&
        typeof capabilities.zoom.max === "number"
      ) {

        const minZoom = capabilities.zoom.min || 1;
        const maxZoom = capabilities.zoom.max;

        const targetZoom = Math.min(
          Math.max(1.5, minZoom),
          maxZoom
        );

        if (targetZoom > minZoom) {

          await scanner.applyVideoConstraints({
            advanced: [
              { zoom: targetZoom }
            ]
          });

        }
      }

    } catch (e) {
      console.log("Zoom kamera tidak tersedia.");
    }

  } catch (error) {
    console.log("Optimasi kamera menggunakan pengaturan default.");
  }
}


// ==================================================
// STOP SCANNER
// ==================================================

async function stopScanner() {

  scanLocked = true;

  if (scanner) {

    try {
      if (running) {
        await scanner.stop();
      }
    } catch (error) {
      console.error("Stop error:", error);
    }

    try {
      await scanner.clear();
    } catch (error) {
      console.error("Clear error:", error);
    }

  }

  scanner = null;
  running = false;

  startButton.disabled = false;

  statusElement.textContent =
    "Kamera sudah dimatikan.";
}

</script>

</body>
</html>
