
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087c4b">
  <title>IDOLAMU Barcode Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      padding-bottom: 45px;
      background: #f3f5f8;
      color: #263445;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      max-width: 650px;
      margin: auto;
      background: #fff;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 3px 18px rgba(0,0,0,.07);
    }

    h2 {
      margin: 2px 0 8px;
      text-align: center;
      color: #087c4b;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .mode-row {
      display: flex;
      gap: 9px;
      margin-bottom: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 16px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      color: #263445;
      background: #e8edf3;
      margin-top: 10px;
      min-height: 54px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    button.primary {
      background: #087c4b;
      color: white;
    }

    button.secondary {
      background: #e8edf3;
      color: #263445;
    }

    button.active {
      background: #087c4b;
      color: white;
    }

    .mode-row button {
      margin-top: 0;
      font-size: 14px;
      padding: 13px 7px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      min-height: 220px;
      overflow: hidden;
      background: #111b24;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #111b24;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #111b24;
    }

    .section-label {
      margin: 20px 0 9px;
      color: #667085;
      font-size: 15px;
    }

    .status {
      margin-top: 14px;
      padding: 13px;
      background: #f0f3f6;
      border-radius: 10px;
      color: #475467;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .result {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      display: none;
    }

    .result strong {
      display: block;
      margin-bottom: 8px;
    }

    .barcode-value {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #087c4b;
      overflow-wrap: anywhere;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      letter-spacing: 2px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-top: 10px;
    }

    .small-note {
      color: #667085;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 9px;
    }

    .hidden { display: none !important; }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 20px;
      background: #e5e7eb;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #087c4b;
      transition: width .2s;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #98a2b3;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="app">
    <h2>IDOLAMU BARCODE SCANNER</h2>
    <div class="subtitle">Pemindai barcode produk</div>

    <div class="mode-row">
      <button id="photoModeBtn" class="active" onclick="selectMode('photo')">
        FOTO & BACA
      </button>
      <button id="liveModeBtn" onclick="selectMode('live')">
        LIVE SCAN
      </button>
    </div>

    <div class="camera-box">
      <video id="video" autoplay muted playsinline></video>
      <img id="photoPreview" class="preview" alt="Foto barcode">
    </div>

    <button id="captureBtn" class="primary" onclick="capturePhoto()">
      AMBIL FOTO & BACA BARCODE
    </button>

    <button id="retakeBtn" class="secondary hidden" onclick="retakePhoto()">
      AMBIL FOTO ULANG
    </button>

    <button id="decodeAgainBtn" class="secondary hidden" onclick="decodePhotoAgain()">
      COBA BACA FOTO LAGI
    </button>

    <button id="ocrBtn" class="primary hidden" onclick="readBarcodeNumbers()">
      BACA ANGKA BARCODE (OCR)
    </button>

    <button id="focusBtn" class="secondary" onclick="focusCamera()">
      FOKUS ULANG
    </button>

    <button id="torchBtn" class="secondary hidden" onclick="toggleTorch()">
      NYALAKAN FLASH
    </button>

    <div id="zoomArea" class="hidden">
      <div class="section-label">ZOOM KAMERA: <span id="zoomValue">1.0x</span></div>
      <input id="zoomSlider" type="range" min="1" max="3" step=".1" value="1">
    </div>

    <div class="section-label">Hasil pembacaan:</div>

    <div id="resultBox" class="result">
      <strong>Barcode terdeteksi:</strong>
      <div id="barcodeResult" class="barcode-value"></div>
    </div>

    <div id="manualArea" class="hidden">
      <div class="section-label">Periksa atau koreksi angka barcode:</div>
      <input id="manualBarcode" type="text" inputmode="numeric"
             maxlength="13" placeholder="Masukkan 13 digit barcode">
      <button class="primary" onclick="submitManualBarcode()">
        KIRIM ANGKA BARCODE
      </button>
      <div class="small-note">
        Angka hanya akan dikirim jika berjumlah 13 digit dan lolos validasi EAN-13.
      </div>
    </div>

    <div id="progress" class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="status" class="status">
      Tekan FOTO & BACA untuk mulai menggunakan kamera.
    </div>

    <div class="footer">IDOLAMU STOCK CONTROL</div>
  </main>

<script>
  const LIVE_SCANNER_ORIGIN = "https://devrajsilaban.github.io";

  const video = document.getElementById("video");
  const photoPreview = document.getElementById("photoPreview");
  const statusBox = document.getElementById("status");

  let reader = null;
  let stream = null;
  let track = null;
  let photoDataUrl = null;
  let currentMode = "photo";
  let scanLocked = false;
  let starting = false;
  let torchOn = false;
  let ocrWorker = null;

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function show(id, visible) {
    document.getElementById(id).classList.toggle("hidden", !visible);
  }

  function setProgress(value) {
    const progress = document.getElementById("progress");
    const bar = document.getElementById("progressBar");

    progress.style.display = value >= 0 ? "block" : "none";
    bar.style.width = Math.max(0, Math.min(100, value)) + "%";
  }

  function getReader() {
    if (!reader) {
      reader = new ZXing.BrowserMultiFormatReader();
    }
    return reader;
  }

  async function stopCamera() {
    try {
      if (reader) reader.reset();
    } catch (e) {}

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    stream = null;
    track = null;
    video.srcObject = null;
    torchOn = false;
    show("torchBtn", false);
    show("zoomArea", false);
  }

  async function selectMode(mode) {
    if (starting) return;

    currentMode = mode;
    document.getElementById("photoModeBtn").classList.toggle("active", mode === "photo");
    document.getElementById("liveModeBtn").classList.toggle("active", mode === "live");

    await stopCamera();

    photoDataUrl = null;
    scanLocked = false;

    photoPreview.style.display = "none";
    video.style.display = "block";

    show("retakeBtn", false);
    show("decodeAgainBtn", false);
    show("ocrBtn", false);
    show("manualArea", false);
    show("resultBox", false);

    document.getElementById("captureBtn").classList.toggle("hidden", mode !== "photo");
    document.getElementById("focusBtn").classList.remove("hidden");

    if (mode === "photo") {
      await startPhotoCamera();
    } else {
      await startLiveScanner();
    }
  }

  async function waitForVideo() {
    if (video.readyState >= 2 && video.videoWidth > 0) return;

    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("Kamera tidak siap.")), 12000);

      video.onloadedmetadata = () => {
        clearTimeout(timeout);
        resolve();
      };
    });
  }

  async function startPhotoCamera() {
    if (starting) return;
    starting = true;

    try {
      setStatus("Mengaktifkan kamera...");
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = stream;
      await video.play();
      await waitForVideo();

      track = stream.getVideoTracks()[0];
      configureCameraControls();

      setStatus("Kamera siap. Arahkan barcode ke kamera, tunggu fokus, lalu ambil foto.");
    } catch (error) {
      setStatus("Gagal membuka kamera: " + error.message +
        ". Pastikan izin kamera di browser sudah diberikan.");
    } finally {
      starting = false;
    }
  }

  async function startLiveScanner() {
    if (starting) return;
    starting = true;

    try {
      setStatus("Mengaktifkan Live Scan...");

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      const controls = await getReader().decodeFromConstraints(
        constraints,
        video,
        (result, error) => {
          if (result && !scanLocked) {
            handleBarcode(result.getText());
          }
        }
      );

      // ZXing mengelola stream kamera pada mode Live Scan.
      if (video.srcObject) {
        stream = video.srcObject;
        track = stream.getVideoTracks()[0];
        configureCameraControls();
      }

      setStatus("Live Scan aktif. Arahkan kamera ke barcode.");
    } catch (error) {
      setStatus("Live Scan gagal: " + error.message);
    } finally {
      starting = false;
    }
  }

  function configureCameraControls() {
    if (!track) return;

    const capabilities = track.getCapabilities ? track.getCapabilities() : {};

    if (capabilities.torch) {
      show("torchBtn", true);
    }

    if (capabilities.zoom) {
      const slider = document.getElementById("zoomSlider");
      slider.min = capabilities.zoom.min;
      slider.max = Math.min(capabilities.zoom.max, 4);
      slider.step = capabilities.zoom.step || .1;
      slider.value = capabilities.zoom.min;
      document.getElementById("zoomValue").textContent =
        Number(slider.value).toFixed(1) + "x";
      show("zoomArea", true);
    }
  }

  document.getElementById("zoomSlider").addEventListener("input", async function() {
    const value = Number(this.value);
    document.getElementById("zoomValue").textContent = value.toFixed(1) + "x";

    if (track) {
      try {
        await track.applyConstraints({ advanced: [{ zoom: value }] });
      } catch (e) {}
    }
  });

  async function toggleTorch() {
    if (!track) return;

    try {
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      document.getElementById("torchBtn").textContent =
        torchOn ? "MATIKAN FLASH" : "NYALAKAN FLASH";
    } catch (error) {
      setStatus("Flash tidak didukung oleh kamera ini.");
      torchOn = false;
    }
  }

  async function focusCamera() {
    if (!track) {
      setStatus("Kamera belum aktif.");
      return;
    }

    try {
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};

      if (capabilities.focusMode) {
        await track.applyConstraints({
          advanced: [{ focusMode: "continuous" }]
        });
      }

      setStatus("Perintah fokus dikirim. Tahan kamera agar tidak bergerak.");
    } catch (error) {
      setStatus("Fokus otomatis tidak dapat diatur pada perangkat ini.");
    }
  }

  async function capturePhoto() {
    if (!video.videoWidth || !video.videoHeight) {
      setStatus("Kamera belum siap. Tunggu beberapa saat.");
      return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    photoDataUrl = canvas.toDataURL("image/jpeg", 0.98);

    photoPreview.src = photoDataUrl;
    photoPreview.style.display = "block";
    video.style.display = "none";

    show("retakeBtn", true);
    show("decodeAgainBtn", true);
    show("ocrBtn", true);
    show("manualArea", false);
    show("resultBox", false);

    document.getElementById("captureBtn").classList.add("hidden");
    document.getElementById("focusBtn").classList.add("hidden");

    await decodePhoto();
  }

  async function decodePhoto() {
    if (!photoDataUrl) return;

    setStatus("Membaca pola garis barcode...");
    setProgress(20);

    try {
      const image = new Image();
      image.src = photoDataUrl;
      await image.decode();

      const result = await getReader().decodeFromImageElement(image);
      setProgress(-1);

      if (result) {
        handleBarcode(result.getText());
        return;
      }
    } catch (error) {
      // Tidak ditemukan barcode pada foto. Pengguna dapat mencoba OCR.
    }

    setProgress(-1);
    setStatus("Barcode belum terbaca dari pola garis. Coba BACA ANGKA BARCODE (OCR).");
  }

  async function decodePhotoAgain() {
    if (!photoDataUrl) return;

    scanLocked = false;
    show("resultBox", false);
    show("manualArea", false);

    await decodePhoto();
  }

  async function retakePhoto() {
    photoDataUrl = null;
    photoPreview.style.display = "none";
    video.style.display = "block";

    show("retakeBtn", false);
    show("decodeAgainBtn", false);
    show("ocrBtn", false);
    show("manualArea", false);
    show("resultBox", false);

    document.getElementById("captureBtn").classList.remove("hidden");
    document.getElementById("focusBtn").classList.remove("hidden");

    scanLocked = false;
    setStatus("Arahkan barcode ke kamera dan ambil foto ulang.");
  }

  async function getOcrWorker() {
    if (ocrWorker) return ocrWorker;

    setStatus("Menyiapkan mesin OCR untuk pertama kali...");

    ocrWorker = await Tesseract.createWorker("eng", 1, {
      logger: message => {
        if (message.status === "recognizing text") {
          setProgress(Math.round(message.progress * 100));
          setStatus("OCR sedang membaca angka barcode: " +
            Math.round(message.progress * 100) + "%");
        }
      }
    });

    await ocrWorker.setParameters({
      tessedit_char_whitelist: "0123456789",
      tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
    });

    return ocrWorker;
  }

  function prepareOcrImage() {
    const image = new Image();
    image.src = photoDataUrl;

    return image.decode().then(() => {
      const sourceWidth = image.naturalWidth;
      const sourceHeight = image.naturalHeight;

      // Fokus pada bagian bawah foto, tempat angka barcode biasanya tercetak.
      const cropX = Math.round(sourceWidth * 0.05);
      const cropY = Math.round(sourceHeight * 0.52);
      const cropWidth = Math.round(sourceWidth * 0.90);
      const cropHeight = Math.round(sourceHeight * 0.43);

      const scale = 2.5;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(cropWidth * scale);
      canvas.height = Math.round(cropHeight * scale);

      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(
        image,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, canvas.width, canvas.height
      );

      // Tingkatkan kontras agar angka lebih mudah dikenali.
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;

      for (let i = 0; i < pixels.length; i += 4) {
        const gray = (
          pixels[i] * 0.299 +
          pixels[i + 1] * 0.587 +
          pixels[i + 2] * 0.114
        );

        const adjusted = gray > 155 ? 255 : 0;
        pixels[i] = adjusted;
        pixels[i + 1] = adjusted;
        pixels[i + 2] = adjusted;
      }

      context.putImageData(imageData, 0, 0);
      return canvas;
    });
  }

  function isValidEan13(value) {
    if (!/^\d{13}$/.test(value)) return false;

    let sum = 0;

    for (let i = 0; i < 12; i++) {
      sum += Number(value[i]) * (i % 2 === 0 ? 1 : 3);
    }

    const checkDigit = (10 - (sum % 10)) % 10;
    return checkDigit === Number(value[12]);
  }

  function findEan13Candidates(text) {
    const digits = text.replace(/\D/g, "");
    const candidates = [];

    for (let i = 0; i <= digits.length - 13; i++) {
      const candidate = digits.substring(i, i + 13);

      if (isValidEan13(candidate) && !candidates.includes(candidate)) {
        candidates.push(candidate);
      }
    }

    return candidates;
  }

  async function readBarcodeNumbers() {
    if (!photoDataUrl) {
      setStatus("Ambil foto terlebih dahulu.");
      return;
    }

    const ocrButton = document.getElementById("ocrBtn");
    ocrButton.disabled = true;
    setProgress(0);

    try {
      setStatus("Mempersiapkan foto untuk membaca angka barcode...");

      const canvas = await prepareOcrImage();
      const worker = await getOcrWorker();

      setStatus("OCR sedang membaca angka di bawah barcode...");
      const result = await worker.recognize(canvas);

      setProgress(-1);

      const recognizedText = result.data.text || "";
      const candidates = findEan13Candidates(recognizedText);

      if (candidates.length === 1) {
        setStatus("Angka ditemukan dan validasi EAN-13 berhasil.");
        handleBarcode(candidates[0]);
        return;
      }

      if (candidates.length > 1) {
        setStatus("Ditemukan beberapa kemungkinan angka. Silakan periksa dan pilih hasil yang benar.");
        document.getElementById("manualBarcode").value = candidates[0];
      } else {
        const rawDigits = recognizedText.replace(/\D/g, "");
        const possible = rawDigits.length >= 13
          ? rawDigits.substring(0, 13)
          : rawDigits;

        document.getElementById("manualBarcode").value = possible;
        setStatus("OCR belum menemukan angka EAN-13 yang valid. Periksa hasilnya atau ambil foto ulang.");
      }

      show("manualArea", true);
    } catch (error) {
      setProgress(-1);
      setStatus("OCR gagal dijalankan: " + error.message);
      show("manualArea", true);
    } finally {
      ocrButton.disabled = false;
    }
  }

  function submitManualBarcode() {
    const value = document.getElementById("manualBarcode").value.trim();

    if (!isValidEan13(value)) {
      setStatus("Angka belum valid. Pastikan 13 digit dan digit pemeriksa EAN-13 benar.");
      return;
    }

    handleBarcode(value);
  }

  function handleBarcode(value) {
    if (scanLocked) return;

    const barcode = String(value || "").replace(/\s/g, "");

    if (!barcode) return;

    scanLocked = true;

    document.getElementById("barcodeResult").textContent = barcode;
    show("resultBox", true);

    setStatus("Barcode berhasil dibaca: " + barcode + ". Mengirim ke aplikasi IDOLAMU...");

    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: "IDOLAMU_BARCODE",
          barcode: barcode
        }, "*");

        setTimeout(() => window.close(), 700);
      } else {
        setStatus("Barcode terbaca: " + barcode +
          ". Jendela aplikasi utama tidak ditemukan. Salin angka ini ke aplikasi.");
        document.getElementById("manualBarcode").value = barcode;
        show("manualArea", true);
      }
    } catch (error) {
      setStatus("Barcode terbaca, tetapi gagal dikirim: " + error.message);
      document.getElementById("manualBarcode").value = barcode;
      show("manualArea", true);
    }
  }

  window.addEventListener("beforeunload", () => {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    if (ocrWorker) {
      ocrWorker.terminate();
    }
  });

  // Mode foto menjadi mode awal.
  selectMode("photo");
</script>
</body>
</html>
