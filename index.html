<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idolamu Smart Barcode Scanner</title>

  <!-- ZXing barcode decoding engine -->
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      color: #202833;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #24374a;
      color: white;
      font-size: 15px;
      margin: 7px 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      min-height: 220px;
    }

    #reader video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 220px;
      object-fit: cover;
    }

    #result {
      padding: 14px;
      background: #eef3f7;
      border-radius: 7px;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .status {
      font-size: 13px;
      color: #64717d;
      line-height: 1.5;
    }

    .scanner-info {
      font-size: 12px;
      color: #64717d;
      line-height: 1.5;
      margin-top: 12px;
    }

    .scan-frame {
      position: relative;
    }

    .scan-frame::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 25%;
      bottom: 25%;
      border: 2px solid rgba(255,255,255,.75);
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Idolamu Smart Scanner</h2>

  <p class="status" id="status">
    Scanner belum dijalankan.
  </p>

  <button id="startButton" onclick="startScanner()">
    Aktifkan Kamera Belakang
  </button>

  <button id="stopButton" onclick="stopScanner()">
    Matikan Kamera
  </button>

  <div id="reader" class="scan-frame">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div id="result">
    Barcode: Belum terbaca
  </div>

  <div class="scanner-info">
    SMART SCANNING · SMALL BARCODE DETECTION
    <br>
    Arahkan barcode ke kamera dan tunggu hingga fokus.
  </div>

</div>

<script>
let reader = null;
let controls = null;
let running = false;
let scanLocked = false;
let lastCode = "";

const statusElement = document.getElementById("status");
const resultElement = document.getElementById("result");
const startButton = document.getElementById("startButton");
const videoElement = document.getElementById("video");

// ==================================================
// FORMAT BARCODE
// ==================================================

function createReader() {

  const hints = new Map();

  hints.set(
    ZXing.DecodeHintType.POSSIBLE_FORMATS,
    [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF
    ]
  );

  // Meminta decoder melakukan pencarian lebih intensif.
  hints.set(
    ZXing.DecodeHintType.TRY_HARDER,
    true
  );

  return new ZXing.BrowserMultiFormatReader(
    hints,
    100
  );
}


// ==================================================
// START SCANNER
// ==================================================

async function startScanner() {

  if (running) return;

  try {

    if (!window.ZXing) {
      throw new Error("Mesin barcode ZXing gagal dimuat. Periksa koneksi internet.");
    }

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error("Browser tidak mendukung akses kamera.");
    }

    scanLocked = false;
    lastCode = "";

    startButton.disabled = true;

    resultElement.textContent =
      "Barcode: Menunggu pemindaian...";

    statusElement.textContent =
      "Menyiapkan mesin pembaca barcode...";

    reader = createReader();

    statusElement.textContent =
      "Mengaktifkan kamera belakang...";

    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    controls = await reader.decodeFromConstraints(
      constraints,
      videoElement,
      (result, error) => {

        if (scanLocked || !running) return;

        if (result) {
          handleBarcode(result);
        }

        // NotFoundException adalah kondisi normal
        // ketika belum ada barcode yang ditemukan.
      }
    );

    running = true;

    statusElement.textContent =
      "LIVE SCANNING · Arahkan barcode ke kamera.";

    // Optimasi fokus dan zoom jika perangkat mendukung.
    optimizeCamera();

  } catch (error) {

    console.error("Scanner error:", error);

    statusElement.textContent =
      "Gagal: " + (error.message || error);

    await stopScanner(true);
  }
}


// ==================================================
// CAMERA OPTIMIZATION
// ==================================================

async function optimizeCamera() {

  try {

    const stream = videoElement.srcObject;

    if (!stream) return;

    const track = stream.getVideoTracks()[0];

    if (!track) return;

    const capabilities =
      track.getCapabilities ? track.getCapabilities() : {};

    const advanced = {};

    // Autofocus berkelanjutan jika didukung.
    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes("continuous")
    ) {
      advanced.focusMode = "continuous";
    }

    // Hindari zoom otomatis yang terlalu tinggi.
    // Zoom dapat mengurangi area pandang kamera.
    if (
      capabilities.zoom &&
      capabilities.zoom.min !== undefined
    ) {
      advanced.zoom = capabilities.zoom.min;
    }

    if (Object.keys(advanced).length > 0) {
      try {
        await track.applyConstraints({
          advanced: [advanced]
        });
      } catch (error) {
        console.log("Pengaturan kamera tidak didukung:", error);
      }
    }

  } catch (error) {
    console.log("Kamera menggunakan pengaturan default.");
  }
}


// ==================================================
// BARCODE DETECTED
// ==================================================

function handleBarcode(result) {

  const barcode = String(result.getText() || "").trim();

  if (!barcode || scanLocked || barcode === lastCode) {
    return;
  }

  scanLocked = true;
  lastCode = barcode;

  resultElement.innerHTML =
    "<b>Barcode terbaca:</b><br>" + barcode;

  statusElement.textContent =
    "Barcode berhasil dibaca!";

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }

  // Pertahankan integrasi lama Idolamu.
  if (window.opener && !window.opener.closed) {

    window.opener.postMessage(
      {
        type: "IDOLAMU_BARCODE",
        barcode: barcode
      },
      "*"
    );

    statusElement.textContent =
      "Barcode berhasil dikirim ke Idolamu!";

    setTimeout(async () => {
      await stopScanner();
      window.close();
    }, 700);

  } else {

    statusElement.textContent =
      "Barcode terbaca, tetapi jendela Idolamu tidak ditemukan.";

    scanLocked = false;
  }
}


// ==================================================
// STOP SCANNER
// ==================================================

async function stopScanner(silent = false) {

  scanLocked = true;

  if (controls) {
    try {
      controls.stop();
    } catch (error) {
      console.log(error);
    }
  }

  controls = null;

  if (videoElement.srcObject) {
    videoElement.srcObject
      .getTracks()
      .forEach(track => track.stop());

    videoElement.srcObject = null;
  }

  if (reader) {
    try {
      reader.reset();
    } catch (error) {
      console.log(error);
    }
  }

  reader = null;
  running = false;

  startButton.disabled = false;

  if (!silent) {
    statusElement.textContent =
      "Kamera sudah dimatikan.";
  }
}

</script>

</body>
</html>
